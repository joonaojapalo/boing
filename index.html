<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Boing: jump height</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <h1>Boing</h1>
      <div class="controls">
        <button id="front">Front camera</button>
        <button id="back">Back camera</button>
        <label class="button">Open video…<input id="file" type="file" accept="video/*" hidden /></label>
        <button id="stop">Stop</button>
        <label class="stature">Body height <input id="stature" type="number" value="175" min="100" max="230" /> cm</label>
      </div>
    </header>
    <main>
      <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <aside>
        <div id="status">Place the phone so your whole body, including the feet, is visible. Then start a camera.</div>
        <canvas id="plot" hidden></canvas>
        <ol id="results"></ol>
        <div id="ignored"></div>
      </aside>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
